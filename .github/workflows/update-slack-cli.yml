name: Update slack-cli Formula

# slack-cli 側からトークン付きで通知させる代わりに、こちらから最新リリースを見に行く。
# 自リポジトリを書き換えるだけなので GITHUB_TOKEN で足り、PAT の管理が要らない。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE_REPO=mimo-3/slack-cli

          TAG=$(gh release view --repo "$SOURCE_REPO" --json tagName --jq .tagName)
          VERSION_NUM="${TAG#v}"

          # sha256 はリリース時に固めた .sha256 をそのまま使う（tar.gz を落とし直さない）
          gh release download "$TAG" --repo "$SOURCE_REPO" --pattern '*.sha256' --dir shas --clobber
          ARM64_SHA=$(awk '{print $1}' shas/slack-cli-aarch64-apple-darwin.tar.gz.sha256)
          X86_64_SHA=$(awk '{print $1}' shas/slack-cli-x86_64-apple-darwin.tar.gz.sha256)
          rm -rf shas

          cat > Formula/slack-cli.rb << 'FORMULA'
          class SlackCli < Formula
            desc "CLI for the Slack Web API"
            homepage "https://github.com/mimo-3/slack-cli"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/mimo-3/slack-cli/releases/download/vVERSION_PLACEHOLDER/slack-cli-aarch64-apple-darwin.tar.gz"
                sha256 "ARM64_SHA_PLACEHOLDER"
              end
              on_intel do
                url "https://github.com/mimo-3/slack-cli/releases/download/vVERSION_PLACEHOLDER/slack-cli-x86_64-apple-darwin.tar.gz"
                sha256 "X86_64_SHA_PLACEHOLDER"
              end
            end

            def install
              bin.install "slack-cli"
            end

            test do
              assert_match "slack-cli", shell_output("#{bin}/slack-cli --version")
            end
          end
          FORMULA

          sed -i "s/VERSION_PLACEHOLDER/$VERSION_NUM/g" Formula/slack-cli.rb
          sed -i "s/ARM64_SHA_PLACEHOLDER/$ARM64_SHA/g" Formula/slack-cli.rb
          sed -i "s/X86_64_SHA_PLACEHOLDER/$X86_64_SHA/g" Formula/slack-cli.rb

          if git diff --quiet -- Formula/slack-cli.rb; then
            echo "slack-cli $TAG は反映済み"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/slack-cli.rb
          git commit -m "Update slack-cli to $TAG"
          git push
